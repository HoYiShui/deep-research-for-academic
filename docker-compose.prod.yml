# Prod override — adds the backend and (once a frontend exists) the frontend.
# It reuses the service-backed data infrastructure from docker-compose.yml. Run with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Secrets are injected via env_file (never inlined). Model weights are
# volume-mounted (pin the host path with BGE_M3_MODEL_HOST_PATH). The sandbox
# uses nsjail in prod — the backend container gets no docker socket.

services:
  # ---- Backend ----
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env          # secrets: ANTHROPIC_API_KEY / BOCHA_API_KEY / JWT_SECRET
    environment:
      # Container-internal hostnames override the dev (localhost) values in .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-deepresearch}:${POSTGRES_PASSWORD:-deepresearch}@postgres:5432/${POSTGRES_DB:-deepresearch}
      MILVUS_URI: http://milvus:19530
      MINIO_ENDPOINT: minio:9000
      BGE_M3_MODEL_PATH: /models/bge-m3
      BGE_RERANKER_MODEL_PATH: /models/bge-reranker-v2-m3
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      - ${BGE_M3_MODEL_HOST_PATH:-./models/bge-m3}:/models/bge-m3:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy

  # ---- Frontend (uncomment once frontend/ exists) ----
  # frontend:
  #   build:
  #     context: ./frontend
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
  #   depends_on:
  #     - backend

volumes:
  etcd_data:
  milvus_minio_data:
  milvus_data:
