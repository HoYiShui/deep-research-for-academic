[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Deep Research agent for cybersecurity academic research"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.29",
    "asyncpg>=0.29",
    "pymilvus>=2.4",
    "httpx>=0.27",
    "httpcore[asyncio]==1.0.9",
    "anthropic>=0.34",
    "bcrypt>=5.0.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.0,<2",
    "minio==7.2.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]
embedding = [
    "sentence-transformers>=2.7",
]
parser = [
    "mineru==4.0.10; python_version < '3.15'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
