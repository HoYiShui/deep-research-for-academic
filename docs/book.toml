[book]
title = "Deep Research for Academic 文档"
authors = ["HoYiShui"]
language = "zh"
src = "."

[build]
build-dir = "book"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
additional-css = ["theme/custom.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.search]
enable = true
limit-results = 30

[output.html.fold]
enable = true
level = 1
